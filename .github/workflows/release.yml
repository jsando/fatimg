name: goreleaser

on:
  pull_request:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # Tag pushes do not trigger ci.yml, so the release runs its own test job and
  # depends on it. A tag whose tests fail must not publish a release.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Kept in step with the same steps in ci.yml. This job is the gate on
      # publishing, so it has to run the same tiers, boot test included.
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools qemu-system-x86
      - name: Fetch SYSLINUX
        # Not vendored: we do not redistribute someone else's binaries.
        run: make syslinux
      - name: Test
        # Run through make so the boot test is pointed at the SYSLINUX release
        # fetched above.
        run: make test

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Must be at least the toolchain named in go.mod. This job used to say
      # '1.24', which made GOTOOLCHAIN fetch exactly the go.mod version and
      # ship binaries built with a Go that crashes under qemu-user — fatimg#9.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
